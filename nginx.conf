# Serves the React build and proxies /api to the NestJS backend, so the browser
# sees one origin (no CORS, and the SSE stream works through the same host).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Live meter stream (Server-Sent Events): no buffering, long reads.
  location ~ ^/api/meters/[^/]+/events/stream$ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m;
    chunked_transfer_encoding on;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/, /admin, /analytics) all serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
